<script>
const START={access:78,timeline:76,profit:74,evidence:58,compliance:64,trust:70,risk:32};
const DRAG=1.6;
const ICONS={'RPAT & Approval Visibility':'RPAT','FDA Pre-Submission Strategy':'PRE','Product Change Assessment':'CHG','AI Submission Development':'AI','Hardware Sustaining Assessment':'HW','SICR / CDF / SCM Review':'SCM','Next Generation Strategy':'NEXT'};
const stops=[
{id:'rpat',phase:'RPAT & Approval Visibility',title:'RPAT & Approval Visibility',project:'RPAT Gap Assessment',scene:'CardioSight was acquired several years ago and is now being discussed for broader commercial planning. Leadership wants the product added to RPAT so teams can understand shipment eligibility, market availability, and approval status. The information is not cleanly in one place: identifiers, approval evidence, IFU ownership, SAP data, legacy records, and Regulatory Operations inputs are spread across systems and owners. One region appears commercially active, but RA cannot yet trace that status to source approval evidence.',prompt:'You are the RA lead for the RPAT inclusion effort. What do you recommend before the request moves forward?',choices:[
{tone:'good',label:'Map the RPAT inputs, owners, identifiers, and approval evidence first, then submit once the open assumptions are documented and the entry can be fully traced back to source.',result:'You slow the request slightly, but the team understands what is known, what is missing, and who owns each blocker. RPAT inclusion becomes a controlled regulatory data activity.',impact:{timeline:-3,profit:1,evidence:14,compliance:11,access:5,trust:8,risk:-9},debt:[]},
{tone:'mid',label:'Move the request forward while the evidence review runs in parallel, flagging any markets, identifiers, or records that still need confirmation before the entry is finalized.',result:'The team keeps moving, but some assumptions are still open while the request is built. Manageable if everyone follows through, but unresolved market evidence may resurface later.',impact:{timeline:4,profit:3,evidence:4,compliance:2,access:2,trust:2,risk:5},debt:['Documentation debt']},
{tone:'bad',label:'Use the mature commercial history and existing records to submit now, closing any specific approval or identifier questions quickly if a reviewer later asks for the source.',result:'The request looks efficient at first, but unsupported assumptions now enter the record. If anyone asks for source evidence later, RA must reconstruct the approval story under pressure.',impact:{timeline:8,profit:2,evidence:-13,compliance:-12,access:-4,trust:-7,risk:15},debt:['Unsupported approval claim','Missing product data']} ]},
{id:'presub',phase:'FDA Pre-Submission Strategy',title:'FDA Pre-Submission Strategy',project:'IVUS Reprocessing Pre-Sub Support',scene:'A team is preparing a Pre-Submission strategy for a reprocessed IVUS catheter project. The core question is how to frame the regulatory questions for FDA: what evidence is available, what bench or validation information may be needed, how reprocessing could affect performance or labeling, and which FDA questions would reduce uncertainty before committing to a larger submission strategy.',prompt:'How should RA structure the FDA Pre-Submission approach?',choices:[
{tone:'good',label:'Center the Pre-Submission on the highest-risk uncertainties, presenting the approach and evidence, and asking FDA questions that could change testing, labeling, or submission strategy.',result:'FDA receives a clear package with actionable questions. The team leaves with feedback that can guide evidence planning and reduce later submission uncertainty.',impact:{timeline:-4,profit:-2,evidence:14,compliance:12,access:4,trust:8,risk:-10},debt:[],fda:'strong'},
{tone:'mid',label:'Blend several focused questions with broader discussion topics, giving FDA room to react even though some feedback may be harder to translate into direct project decisions.',result:'The team gains useful feedback, but some FDA responses are broad and require interpretation. Workable, but RA must translate the feedback into clearer next steps.',impact:{timeline:-2,profit:-3,evidence:6,compliance:4,trust:3,risk:4},debt:['Pre-Sub package gaps'],fda:'mixed'},
{tone:'bad',label:'Keep the questions broad to protect flexibility while development matures, using the meeting mainly to learn FDA expectations before committing to a specific evidence plan.',result:'The interaction happens, but it produces limited direction. FDA cannot give strong feedback because the questions are too broad and the evidence strategy is not specific enough.',impact:{timeline:5,profit:2,evidence:-9,compliance:-7,access:-3,trust:-6,risk:13},debt:['Weak Pre-Sub strategy','Pre-Sub package gaps'],fda:'weak'} ]},
{id:'change',phase:'Product Change Assessment',title:'Product Change Assessment',project:'Regulatory Change Impact Review',scene:'Engineering proposes a significant CardioSight update that could improve workflow efficiency and reduce procedural burden. The business wants speed, but RA still needs to determine what is actually changing, whether intended use could be affected, what evidence may be needed, and whether the update creates submission or market-specific implications.',prompt:'How should RA assess the proposed product change before development accelerates?',choices:[
{tone:'good',label:'Define the change scope with Engineering before major commitments, comparing it against intended use and existing claims to surface evidence, documentation, and submission impacts.',result:'The team starts with a clearer regulatory path. Evidence needs, submission assumptions, and decision owners are aligned before the project becomes harder to redirect.',impact:{timeline:-3,profit:1,evidence:12,compliance:10,access:5,trust:7,risk:-8},debt:[]},
{tone:'mid',label:'Let early development continue while RA reviews the highest-risk change elements first, tracking lower-risk documentation and market questions as the design becomes clearer.',result:'The team keeps momentum and catches several major issues, but some regulatory questions remain open while design decisions continue moving.',impact:{timeline:5,profit:4,evidence:4,compliance:2,access:1,trust:2,risk:6},debt:['Product change scope uncertainty']},
{tone:'bad',label:'Move on the existing pathway now to hit the business timeline, expanding the review only if a specific testing, intended-use, or labeling concern actually emerges later.',result:'The project moves quickly, but the strategy rests on assumptions rather than defined evidence. As the change becomes clearer, key questions surface that should have been addressed earlier.',impact:{timeline:8,profit:3,evidence:-10,compliance:-10,access:-5,trust:-6,risk:14},debt:['Unassessed product change','Product change scope uncertainty']} ]},
{id:'ai',phase:'AI Submission Development',title:'AI Submission Development',project:'AI Pilot Study',scene:'The team is preparing a submission package with testing summaries, regulatory rationale, risk-management information, standards references, and responses to FDA feedback. An AI drafting agent can summarize source documents, organize evidence, and draft sections quickly, but it may create unsupported statements if the source package is incomplete or reviewer oversight is weak.',prompt:'What level of AI involvement should RA permit before content enters the submission package?',choices:[
{tone:'good',label:'Let AI draft, organize, and summarize while RA owns the final package, requiring each generated claim to trace to source evidence before it becomes submission-ready.',result:'The team gains efficiency without losing accountability. AI speeds up routine work while RA protects traceability, judgment, and final submission quality.',impact:{timeline:12,profit:7,evidence:12,compliance:10,access:5,trust:8,risk:-9},debt:[]},
{tone:'mid',label:'Point AI at summaries, tables, and administrative sections while RA writes the highest-risk rationale, protecting quality even though some efficiency gains go unused.',result:'The submission stays controlled and traceable, but the team gains less speed than it could have. Conservative and defensible.',impact:{timeline:5,profit:3,evidence:7,compliance:6,access:2,trust:5,risk:-3},debt:[]},
{tone:'bad',label:'Let AI draft most sections to hit the submission date, focusing RA review on the areas that look highest risk and correcting anything reviewers flag afterward.',result:'The package is produced quickly, but speed hides quality problems. Unsupported claims and weak traceability begin appearing across sections assumed to be low risk.',impact:{timeline:9,profit:-6,evidence:-13,compliance:-12,access:-6,trust:-9,risk:16},debt:['Unverified AI content','Unsupported submission claim']} ]},
{id:'hardware',phase:'Hardware Sustaining Assessment',title:'Hardware Sustaining Assessment',project:'Hardware Sustaining',scene:'PLACEHOLDER',prompt:'How should RA support the sustaining assessment?',choices:[]},
{id:'sicr',phase:'SICR / CDF / SCM Review',title:'SICR / CDF / SCM Review',project:'Hardware Sustaining Deep Dive',scene:'As the sustaining work continues, a related SICR is opened and the team needs RA input. It appears manageable, but it may become a formal Change Request, affect CDF documentation, require certification review, influence Standards and Compliance Matrix updates, or create country-specific regulatory impact.',prompt:'How should RA evaluate the SICR, CDF, and SCM impact?',choices:[
{tone:'good',label:'Capture the SICR in a structured impact table covering CR likelihood, CDF impact, certification or NRTL exposure, SCM updates, affected systems, documentation, and global submission risk.',result:'The team can see both the current state and the downstream risk. SICR/CDF work becomes traceable, and reviewers understand why RA judged the issue as low, medium, or high impact.',impact:{timeline:-4,profit:-2,evidence:15,compliance:15,access:6,trust:9,risk:-11},debt:[]},
{tone:'mid',label:'Hold the SICR as potentially high impact until Engineering clarifies the path, handling CDF and certification-sensitive items first and updating SCM and country views as details mature.',result:'The team avoids missing a serious issue, but the review may become heavier than necessary. Defensible if the open questions are tracked and closed deliberately.',impact:{timeline:-7,profit:-5,evidence:9,compliance:9,access:3,trust:3,risk:-5},debt:['SCM impact gap']},
{tone:'bad',label:'Keep the SICR open at low impact so the team is not slowed, taking on the detailed CDF, SCM, certification, and global review once a Change Request actually confirms the change.',result:'RA delays the hardest questions until the change is already moving. CDF, SCM, certification, or country-submission concerns can appear later under schedule pressure.',impact:{timeline:6,profit:2,evidence:-10,compliance:-12,access:-6,trust:-7,risk:15},debt:['CDF impact underestimated','SCM impact gap','Global submission exposure unclear']} ]},
{id:'future',phase:'Next Generation Strategy',title:'Next Generation Strategy',project:'Project Alfred and Lifecycle Planning',scene:'CardioSight remains commercially important, but leadership is considering longer-term platform decisions. Competitors are moving, customers expect better connectivity, and Engineering is exploring future concepts. Some may fit sustaining updates; others may require a next-generation platform, new evidence, standards analysis, cybersecurity review, or a separate regulatory pathway.',prompt:'How should RA support the long-term next-generation recommendation?',choices:[
{tone:'good',label:'Separate current support from future platform decisions in one lifecycle strategy, weighing technology impact, evidence burden, cybersecurity, standards, market value, and transition timing.',result:'Leadership receives a clearer roadmap. RA connects current support with future strategy instead of treating sustaining work and innovation as competing priorities.',impact:{timeline:-3,profit:4,evidence:11,compliance:11,access:9,trust:9,risk:-9},debt:[]},
{tone:'mid',label:'Continue current support while Engineering matures the concepts, tracking known regulatory questions now but waiting for stronger technical definition before major pathway calls.',result:'The team avoids over-analyzing early ideas, but RA enters future planning later than ideal. Some strategic options may narrow before the complexity is understood.',impact:{timeline:3,profit:4,evidence:3,compliance:2,access:4,trust:2,risk:5},debt:['Future strategy assumption']},
{tone:'bad',label:'Hold regulatory effort until leadership funds a concept, then address technology, standards, cybersecurity, and market pathway questions once the portfolio direction is actually set.',result:'The portfolio discussion moves forward without enough regulatory input. Future teams may inherit assumptions that are expensive to unwind.',impact:{timeline:7,profit:-5,evidence:-9,compliance:-11,access:-7,trust:-7,risk:15},debt:['Future strategy assumption']} ]}
];
const hardwareVariants=[
{title:'EOL Component',scene:'A critical processing-board component used in CardioSight has reached end of life. Engineering identified a replacement that appears electrically equivalent and expects minimal software impact. Procurement wants a quick decision because remaining inventory is limited. A related SICR has been opened to document the issue and determine whether it could become a Change Request, affect certification files, require CDF updates, or update technical documentation.',prompt:'How should RA handle the end-of-life component replacement?',choices:[
{tone:'good',label:'Compare the replacement against the original for electrical, safety, and design equivalence, then confirm certification files, verification evidence, and affected market documentation before releasing the change.',result:'RA confirms whether the replacement is truly equivalent and where certification or documentation must be updated. Slower, but avoids a hidden compliance gap.',impact:{timeline:-4,profit:-1,evidence:13,compliance:12,access:5,trust:7,risk:-9},debt:[]},
{tone:'mid',label:'Approve the replacement for the most inventory-critical configurations first, confirming certification-sensitive evidence now and updating lower-risk documentation and market files afterward.',result:'Supply risk eases and the biggest certification questions are handled, but some documentation and market updates stay open and must be tracked to closure.',impact:{timeline:4,profit:4,evidence:4,compliance:3,access:2,trust:2,risk:6},debt:['Deferred sustaining review']},
{tone:'bad',label:'Accept the replacement now on the strength of electrical equivalence to protect the build schedule, opening a certification and documentation review only if a later question comes up.',result:'Production keeps running, but equivalence does not automatically clear certification files, technical documentation, or market records. Those questions can resurface as findings.',impact:{timeline:8,profit:4,evidence:-9,compliance:-11,access:-6,trust:-7,risk:15},debt:['Certification impact unknown','Deferred sustaining review']}]},
{title:'Supplier Change',scene:'A qualified supplier for a critical CardioSight subassembly is exiting the market. Procurement found an alternate supplier using the same drawings and specifications, but supplier qualification records and regulatory documentation may still be affected. A related SICR asks whether the change carries certification or documentation impact.',prompt:'How should RA handle the supplier transition?',choices:[
{tone:'good',label:'Confirm supplier qualification, design and specification continuity, verification impact, certification files, and affected market documentation before the alternate supplier is approved for production.',result:'RA keeps the supply path moving while confirming the supporting evidence and certifications remain defensible under the new supplier.',impact:{timeline:-3,profit:-1,evidence:12,compliance:12,access:5,trust:7,risk:-9},debt:[]},
{tone:'mid',label:'Approve the alternate supplier for urgent supply needs while supplier qualification, certification, and country documentation updates are completed as tracked follow-up actions.',result:'Supply continuity is protected and the design is unchanged, but qualification and documentation follow-up remains open and depends on disciplined tracking.',impact:{timeline:4,profit:5,evidence:3,compliance:2,access:2,trust:1,risk:6},debt:['Deferred sustaining review']},
{tone:'bad',label:'Treat the supplier swap as administrative since the drawings and specifications are unchanged, keeping production on schedule and revisiting documentation only if an auditor asks.',result:'The design may not change, but the supporting evidence trail can. Supplier, quality, certification, and market documentation questions can surface later as findings.',impact:{timeline:8,profit:4,evidence:-8,compliance:-11,access:-6,trust:-6,risk:14},debt:['Certification impact unknown','Deferred sustaining review']}]},
{title:'Manufacturing Transfer',scene:'Manufacturing wants to move part of the CardioSight build process to another facility. The product design is not intended to change, but process location, validation records, quality documentation, certification evidence, and market files may be affected. A related SICR asks whether the transfer creates documentation or certification impact.',prompt:'How should RA support the manufacturing transfer?',choices:[
{tone:'good',label:'Assess process validation, site qualification, quality records, certification evidence, technical documentation, and market notification needs before the transfer is implemented.',result:'RA separates true design impact from manufacturing and documentation obligations. The transfer takes longer but the regulatory trail stays strong.',impact:{timeline:-4,profit:-1,evidence:12,compliance:13,access:5,trust:7,risk:-9},debt:[]},
{tone:'mid',label:'Support the transfer in phases, clearing validation and certification-sensitive documentation first while lower-risk quality and market records are completed during ramp-up.',result:'The transfer progresses steadily and the key validation questions are handled, but some evidence reviews remain open and need careful tracking.',impact:{timeline:4,profit:4,evidence:4,compliance:3,access:2,trust:1,risk:6},debt:['Deferred sustaining review']},
{tone:'bad',label:'Proceed with the transfer since the design is unchanged, keeping the site move on schedule and treating validation and certification review as needed only if issues appear.',result:'A transfer can affect more than design. Process validation, certification records, and market files may still need review, which can return as findings.',impact:{timeline:8,profit:4,evidence:-8,compliance:-12,access:-6,trust:-6,risk:15},debt:['Certification impact unknown','Deferred sustaining review']}]},
{title:'Alternate Component',scene:'Engineering proposes an alternate component to reduce supply risk. The component is not clinically visible to users, but it may still affect verification evidence, electrical safety documentation, standards compliance, technical files, or global registrations. The related SICR is currently viewed as low priority.',prompt:'How should RA handle the alternate component proposal?',choices:[
{tone:'good',label:'Evaluate component equivalence, affected verification, safety evidence, standards or certification impact, technical documentation, and market registrations before the alternate part is released.',result:'RA avoids assuming low clinical visibility means low regulatory impact, and creates a defensible basis for implementing the alternate component.',impact:{timeline:-3,profit:-1,evidence:12,compliance:11,access:5,trust:7,risk:-8},debt:[]},
{tone:'mid',label:'Clear the verification and certification-sensitive questions first so the part can be used, then complete lower-risk documentation and country assessments as follow-up items.',result:'The most important risks are handled early and the part becomes usable, but follow-up documentation remains open and depends on clear ownership.',impact:{timeline:4,profit:4,evidence:4,compliance:3,access:2,trust:1,risk:6},debt:['Deferred sustaining review']},
{tone:'bad',label:'Approve the alternate part since it is hidden from users and expected to function the same, protecting supply and expanding the review only if a standards or market question arises.',result:'A hidden component can still affect evidence, standards, documentation, and certifications. The team may need to rework the assessment after implementation begins.',impact:{timeline:8,profit:4,evidence:-8,compliance:-10,access:-6,trust:-6,risk:14},debt:['Certification impact unknown','Deferred sustaining review']}]}
];
const debtInfo={
'Documentation debt':['rpat','RPAT & Approval Visibility','Can surface as an audit finding if records are challenged.'],
'Unsupported approval claim':['rpat','RPAT & Approval Visibility','Can surface as an audit finding or market access question.'],
'Missing product data':['rpat','RPAT & Approval Visibility','Can delay RPAT readiness.'],
'Weak Pre-Sub strategy':['presub','FDA Pre-Submission Strategy','Can surface as an FDA clarification later.'],
'Pre-Sub package gaps':['presub','FDA Pre-Submission Strategy','Can make FDA feedback less actionable.'],
'Product change scope uncertainty':['change','Product Change Assessment','Can weaken the product change path.'],
'Unassessed product change':['change','Product Change Assessment','Can surface as a product change setback.'],
'Unverified AI content':['ai','AI Submission Development','Can surface as a submission quality question.'],
'Unsupported submission claim':['ai','AI Submission Development','Can surface as an FDA or submission concern.'],
'Deferred sustaining review':['hardware','Hardware Sustaining Assessment','Can surface as a certification follow-up.'],
'Certification impact unknown':['hardware','Hardware Sustaining Assessment','Can surface as a certification setback.'],
'CDF impact underestimated':['sicr','SICR / CDF / SCM Review','Can surface as a CDF or CR reassessment.'],
'SCM impact gap':['sicr','SICR / CDF / SCM Review','Can create standards or documentation follow-up.'],
'Global submission exposure unclear':['sicr','SICR / CDF / SCM Review','Can surface as a country-specific submission review.'],
'Future strategy assumption':['future','Next Generation Strategy','Can reduce final product health if next-generation planning is weak.']};
let state={};
function initState(){state={started:false,briefing:false,showDebt:false,idx:0,stats:{...START},selected:null,debt:[],resolvedDebt:[],event:null,randomSeen:0,randomLimit:2,done:false,orders:[],triggered:0,badCount:0,presubChoice:null,fdaFeedbackDone:false,approvalDone:false,hardwareVariant:null,timelineTriggered:false,execTriggered:false,bsiDone:false};}
initState();
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}
function apply(s,i){return{access:clamp(s.access+(i.access||0)),timeline:clamp(s.timeline+(i.timeline||0)),profit:clamp(s.profit+(i.profit||0)),evidence:clamp(s.evidence+(i.evidence||0)),compliance:clamp(s.compliance+(i.compliance||0)),trust:clamp(s.trust+(i.trust||0)),risk:clamp(s.risk+(i.risk||0))}}
function debtScore(){return state.debt.length+(state.stats.risk>65?2:0)+(state.stats.evidence<50?2:0)+(state.stats.compliance<50?2:0)}
function health(){var s=state.stats,core=s.access*.4+s.timeline*.3+s.profit*.3,support=(s.evidence+s.compliance+s.trust+(100-s.risk))/4;return clamp(core+(support-50)*.12-state.debt.length*DRAG)}
function openDebtNames(){return state.debt.map(function(d){return d.name})}
function addDebt(items,source){(items||[]).forEach(function(name){var info=debtInfo[name]||[source,source,'Future review pressure.'];if(!state.debt.some(function(d){return d.name===name}))state.debt.push({name:name,source:source,clearAt:info[0],resolutionPath:info[1],consequence:info[2],activated:false});})}
function activeStop(){var st=Object.assign({},stops[state.idx]);if(st.id==='hardware'&&state.hardwareVariant){st.title=state.hardwareVariant.title;st.scene=state.hardwareVariant.scene;st.prompt=state.hardwareVariant.prompt;st.choices=state.hardwareVariant.choices}return st}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function initOrders(){state.hardwareVariant=hardwareVariants[Math.floor(Math.random()*hardwareVariants.length)];state.orders=stops.map(function(s){var n=(s.id==='hardware'&&state.hardwareVariant)?state.hardwareVariant.choices.length:s.choices.length;return shuffle(Array.apply(null,{length:n}).map(function(_,i){return i}))});state.randomLimit=Math.random()<.55?2:3}
// findings LINGER: no clearDebt on normal triggered events
const debtRules=[
{match:['Documentation debt','Unsupported approval claim','Missing product data'],title:'AUDIT FINDING',text:'An auditor asks for evidence behind an earlier record, and it cannot be fully supported. The finding costs time and credibility, and the gap stays open until it is cleaned up.',impact:{access:-7,timeline:-7,profit:-4,evidence:-5,compliance:-6,trust:-6,risk:9},tone:'bad'},
{match:['Weak Pre-Sub strategy','Pre-Sub package gaps'],title:'FDA CLARIFICATION REQUEST',text:'FDA raises questions the team assumed were settled. Answering them costs time and trust, and the underlying gap remains open.',impact:{access:-4,timeline:-8,profit:-5,evidence:-5,compliance:-5,trust:-6,risk:8},tone:'bad'},
{match:['Product change scope uncertainty','Unassessed product change'],title:'PRODUCT CHANGE SETBACK',text:'The change was not defined tightly enough, and the gap surfaces downstream. It costs time and evidence, and stays open.',impact:{access:-4,timeline:-8,profit:-5,evidence:-5,compliance:-5,trust:-5,risk:8},tone:'bad'},
{match:['Unverified AI content','Unsupported submission claim'],title:'SUBMISSION QUALITY QUESTION',text:'An unsupported claim becomes a submission problem. It costs credibility and time, and the gap remains until addressed.',impact:{access:-6,timeline:-8,profit:-6,evidence:-7,compliance:-7,trust:-7,risk:10},tone:'bad'},
{match:['Certification impact unknown','Deferred sustaining review'],title:'CERTIFICATION SETBACK',text:'A sustaining assumption turns into a certification or documentation problem that has to be absorbed. The gap stays open.',impact:{access:-6,timeline:-8,profit:-6,evidence:-6,compliance:-7,trust:-6,risk:9},tone:'bad'},
{match:['CDF impact underestimated','SCM impact gap','Global submission exposure unclear'],title:'CDF / SCM SETBACK',text:'A SICR, CDF, SCM, or country-impact assumption becomes a downstream problem that costs time and evidence. The gap stays open.',impact:{access:-6,timeline:-8,profit:-6,evidence:-6,compliance:-7,trust:-6,risk:9},tone:'bad'}
];
const randomEvents=[
{title:'MARKET COMMUNICATION PRESSURE',text:'A commercial team wants to communicate availability before every supporting activity is closed.',impact:{access:-4,timeline:-3,profit:2,trust:-3,risk:5},goodIf:function(s,d){return d.length<2&&s.evidence>65},goodText:'RA supports a controlled message that avoids unsupported market claims.',goodImpact:{timeline:1,profit:2,trust:2,risk:-1}},
{title:'NEW STANDARDS RELEASE',text:'A relevant standard is updated. RA screens documentation, submissions, and certifications.',impact:{timeline:-7,profit:-5,compliance:-4,risk:6},goodIf:function(s,d){return s.compliance>72},goodText:'Compliance tracking is strong. The standards screening is quick.',goodImpact:{timeline:-2,compliance:3,risk:-2}},
{title:'COMPETITOR LAUNCH',text:'A competitor launches a next-generation platform. Leadership asks why CardioSight is not moving faster.',impact:{timeline:-6,profit:-4,trust:-3,risk:6},goodIf:function(s,d){return s.risk<42&&s.trust>65},goodText:'Your risk position supports a focused, credible response.',goodImpact:{timeline:2,profit:1,trust:2,risk:-1}}
];
function randomEvent(){var pool=shuffle(randomEvents);var e=pool[state.randomSeen%pool.length];var good=e.goodIf&&e.goodIf(state.stats,state.debt);return {title:e.title,text:good?e.goodText:e.text,impact:good?e.goodImpact:e.impact,kind:good?'Prepared Response':'Random Event',tone:good?'good':'mid'}}
function triggered(){var names=openDebtNames();for(var i=0;i<debtRules.length;i++){var r=debtRules[i];var hit=r.match.find(function(x){return names.indexOf(x)>=0});if(hit){var d=state.debt.find(function(x){return x.name===hit});if(d&&d.activated)continue;if(d)d.activated=true;return {title:'FINDING: '+r.title,text:r.text,impact:r.impact,kind:'Triggered Finding',tone:'bad',trigger:hit}}}return null}
// Guaranteed BSI audit: clears ALL open debt, damage scales with how much debt you carried
function bsiAuditEvent(){var od=state.debt.length;var base={timeline:-3,profit:-2,trust:-2,risk:2};var imp=Object.assign({},base);var per={access:-3,timeline:-2,profit:-2,evidence:-2,compliance:-3,trust:-2,risk:3};for(var k in per){imp[k]=(imp[k]||0)+per[k]*od}var txt;var tone;if(od===0){txt='A BSI auditor requests approval traceability, change rationale, and evidence history. The file everyone feared is ready. Minor findings only.';tone='good'}else if(od<=2){txt='A BSI auditor reviews the trail and finds a couple of open gaps. You take the findings, document the fixes, and close them out.';tone='mid'}else{txt='A BSI auditor targets a weak trail and opens multiple findings at once. It is a hard audit, but every open gap is forced closed as a result.';tone='bad'}return {title:'BSI AUDIT',text:txt,impact:imp,kind:'Scheduled Audit',tone:tone,clearAll:true,countAsFinding:(od>0)}}
function endLoss(){var s=state.stats,h=health();if(s.access<=15||h<=28)return {title:'Product Pulled from Market',text:'The regulatory gaps caught up with CardioSight. Market access collapsed and the product was withdrawn while the team rebuilds the evidence and approvals from scratch.',tone:'bad'};if(s.trust<=8||s.risk>=95||s.timeline<=12||s.profit<=12)return {title:'LinkedIn Update Required',text:'Leadership has scheduled a 15-minute meeting. There is no agenda. HR is attending. Time to update your LinkedIn profile.',tone:'bad'};return null}
function outcome(){var h=health(),d=state.debt.length,r=state.resolvedDebt.length,b=state.badCount;var why='Weak decisions: '+b+'. Open debt: '+d+'. Findings handled: '+state.triggered+'.';var loss=endLoss();if(loss){loss.text+=' '+why;return loss}if(h>=90&&d===0&&state.triggered===0&&b===0)return {title:'Gold Standard',text:'FDA, auditors, leadership, and the product team are all happy. A flawless run. '+why,tone:'good'};if(h>=74&&b<=1)return {title:'Global Success',text:'CardioSight completed the lifecycle on the market with strong product health. '+why,tone:'good'};if(h>=52)return {title:'Regulatory Firefighter',text:'You took some findings, but you kept CardioSight on the market and closed the gaps by the end. You deserve a vacation. '+why,tone:'mid'};return {title:'Product at Risk',text:'CardioSight is still on the market, but significant regulatory concerns remain and product health is fragile. '+why,tone:'bad'}}
function checkDone(){var s=state.stats;if(s.access<=12||s.timeline<=12||s.profit<=12||s.trust<=5||s.risk>=96||health()<=22)state.done=true}
function startGame(){state.started=true;state.briefing=true;initOrders();render()}
function beginJourney(){state.briefing=false;render()}
function resetGame(){initState();render()}
function toggleDebt(){state.showDebt=!state.showDebt;render()}
function choose(displayIndex){if(state.selected||state.event||state.done)return;var st=activeStop();var actual=state.orders[state.idx][displayIndex];var ch=st.choices[actual];state.stats=apply(state.stats,ch.impact);addDebt(ch.debt,st.phase);if(ch.tone==='bad')state.badCount++;state.selected=Object.assign({},ch,{index:displayIndex});if(st.id==='presub')state.presubChoice=ch.fda;checkDone();render()}
function next(){state.selected=null;if(state.done){render();return}var current=activeStop();if(current.id==='presub'&&!state.fdaFeedbackDone){state.event=fdaPreSubFeedback();state.fdaFeedbackDone=true;render();return}if(current.id==='ai'&&!state.approvalDone){state.event=fdaApprovalDecision();state.approvalDone=true;render();return}if(current.id==='sicr'&&!state.bsiDone){state.event=bsiAuditEvent();state.bsiDone=true;render();return}if(!state.timelineTriggered&&state.stats.timeline<48){state.event={title:'TIMELINE PRESSURE',text:'The schedule is slipping. Leadership asks what can be deferred without putting market access at risk.',impact:{timeline:-3,profit:-2,trust:-3,risk:4},kind:'Triggered Event',tone:'mid'};state.timelineTriggered=true;render();return}if(!state.execTriggered&&(debtScore()>=6||state.stats.risk>72||state.stats.trust<42)){state.event={title:'THE VP WANTS ANSWERS',text:'A VP joins because the trail has become risky. Good documentation protects decisions; weak documentation exposes them.',impact:{timeline:-3,profit:-2,trust:-6,risk:4},kind:'Triggered Event',tone:'bad'};state.execTriggered=true;render();return}var debtNow=state.debt.some(function(d){return !d.activated})&&(state.idx>=1&&state.idx<=5);var randomNow=state.randomSeen<state.randomLimit&&state.idx<stops.length-1&&(state.idx%2===0||Math.random()<0.28);if(debtNow){var ev=triggered();if(ev){state.event=ev;render();return}}if(randomNow){state.event=randomEvent();state.randomSeen++;render();return}if(state.idx>=stops.length-1)state.done=true;else state.idx++;render()}
function resolve(){var e=state.event;if(!e)return;state.stats=apply(state.stats,e.impact);if(e.trigger||e.countAsFinding)state.triggered++;if(e.clearAll&&state.debt.length){state.debt.forEach(function(d){state.resolvedDebt.push({name:d.name})});state.debt=[]}checkDone();if(!state.done){if(state.idx>=stops.length-1)state.done=true;else state.idx++}state.event=null;render()}
function fdaPreSubFeedback(){var d=debtScore(),s=state.stats,p=state.presubChoice;if(p==='strong'&&d<=2&&s.evidence>=62)return {title:'FDA FEEDBACK: GENERALLY AGREES',text:'FDA generally agrees with the proposed approach because the questions, evidence, and rationale are clear.',impact:{timeline:2,evidence:3,compliance:3,trust:5,risk:-6},kind:'FDA Feedback',tone:'good'};if(d<=4||p==='mixed')return {title:'FDA FEEDBACK: PARTIALLY AGREES',text:'FDA agrees with portions of the approach but requests clarification on evidence and rationale.',impact:{timeline:-5,profit:-3,evidence:-2,trust:1,risk:4},kind:'FDA Feedback',tone:'mid'};return {title:'FDA FEEDBACK: MORE SUPPORT NEEDED',text:'FDA does not fully support the proposed strategy because the package does not yet provide enough support.',impact:{access:-3,timeline:-9,profit:-6,evidence:-5,compliance:-5,trust:-6,risk:10},kind:'FDA Feedback',tone:'bad'}}
function fdaApprovalDecision(){var d=debtScore(),s=state.stats;if(d<=2&&s.evidence>=70&&s.compliance>=68)return {title:'FDA DECISION: APPROVED',text:'FDA agrees the submission supports the change because the evidence and rationale are strong.',impact:{access:10,timeline:3,profit:4,trust:6,risk:-8},kind:'FDA Decision',tone:'good'};if(d<=4&&s.evidence>=58)return {title:'FDA DECISION: APPROVED WITH QUESTIONS',text:'FDA supports the submission but requests clarification on specific evidence and rationale.',impact:{access:2,timeline:-5,profit:-3,evidence:-2,trust:1,risk:4},kind:'FDA Decision',tone:'mid'};return {title:'FDA DECISION: ADDITIONAL EVIDENCE NEEDED',text:'FDA believes the submission requires more support before the change can be fully supported.',impact:{access:-6,timeline:-11,profit:-8,evidence:-6,compliance:-6,trust:-7,risk:11},kind:'FDA Decision',tone:'bad'}}
// ===== presentation (mobile-first) =====
function statClass(v,rev){return rev?(v>70?'bad':v>45?'warn':'good'):(v>70?'good':v>45?'warn':'bad')}
function col(c){return c==='good'?'#059669':c==='warn'?'#d97706':'#dc2626'}
function metric(label,value,rev){var c=statClass(value,rev);return '<div class="metric"><b>'+label+'</b><div class="num" style="color:'+col(c)+'">'+value+'</div><div class="bar"><div class="fill" style="width:'+value+'%;background:'+col(c)+'"></div></div></div>'}
function impactText(i){var out=[];var ks=['access','timeline','profit','evidence','compliance','trust','risk'];for(var j=0;j<ks.length;j++){var k=ks[j];if(i[k])out.push(k.charAt(0).toUpperCase()+k.slice(1)+' '+(i[k]>0?'+':'')+i[k])}return out.join(' | ')}
function topbar(){return '<div class="topbar"><div><div class="brand">Regulatory Trail</div><div class="subt">CardioSight Simulation</div></div><div class="hpill"><span class="badge health">Health '+health()+'%</span><button class="badge debt" onclick="toggleDebt()">Debt '+state.debt.length+'</button><button class="badge" onclick="resetGame()">Reset</button></div></div>'}
function debtSheet(){if(!state.showDebt)return '';var open=state.debt.length?state.debt.map(function(d){return '<div class="debtitem">'+d.name+'<div class="debtmeta">Area: '+d.resolutionPath+'</div><div class="debtmeta">Possible finding: '+d.consequence+'</div></div>'}).join(''):'<div class="small">No open regulatory debt.</div>';var res=state.resolvedDebt.length?('<div style="margin-top:10px;font-weight:900;font-size:13px">Closed by audit</div>'+state.resolvedDebt.slice(-8).map(function(d){return '<div class="debtitem resolved">'+d.name+'</div>'}).join('')):'';return '<div class="debtpanel" onclick="toggleDebt()"><div class="debtsheet" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-weight:950;font-size:17px">Regulatory Debt</div><button class="btn sm secondary" onclick="toggleDebt()">Close</button></div><div class="small" style="margin-bottom:10px">Open debt lowers Product Health and can surface later as a finding. A scheduled BSI audit near the end forces open gaps closed \u2014 and the more debt you carry, the harder it hits.</div>'+open+res+'</div></div>'}
function frame(inner){return '<div class="wrap">'+topbar()+inner+debtSheet()+'</div>'}
function progress(){var s='';for(var i=0;i<stops.length;i++){s+='<span class="dot '+(i<=state.idx?'on':'')+'"></span>'}return '<div class="progress">'+s+'</div>'}
function support(){var s=state.stats;function row(l,v,rev){return '<div class="suprow"><span>'+l+'</span><span style="color:'+col(statClass(v,rev))+';font-weight:800">'+v+'</span></div>'}return '<details class="support"><summary>Support metrics: Evidence, Compliance, Trust, Risk</summary>'+row('Evidence',s.evidence)+row('Compliance',s.compliance)+row('Trust',s.trust)+row('Risk',s.risk,true)+'</details>'}
function game(){var st=activeStop();var order=state.orders[state.idx]||[0,1,2];var choicesHtml=order.map(function(actual,display){var dis=state.selected&&state.selected.index!==display;return '<button class="choice '+(dis?'disabled':'')+'" '+(state.selected?'disabled':'')+' onclick="choose('+display+')">'+st.choices[actual].label+'</button>'}).join('');var result='';if(state.selected){var t=state.selected.tone||'mid';var head=t==='good'?'Good Outcome':t==='bad'?'Bad Outcome':'Mixed Outcome';result='<div class="result '+t+'"><h3>'+head+'</h3><p>'+state.selected.result+'</p><div class="chip impact">Impact: '+impactText(state.selected.impact)+'</div>'+((state.selected.debt&&state.selected.debt.length)?'<div class="chip debtadd">Regulatory Debt added: '+state.selected.debt.join(', ')+'</div>':'')+'<button class="btn" onclick="next()">'+(state.idx>=stops.length-1?'Finish':'Continue')+'</button></div>'}return '<div class="card"><div class="phasehead"><div class="phaseicon">'+(ICONS[st.phase]||'GO')+'</div><div style="flex:1"><div class="kicker">Checkpoint '+(state.idx+1)+' of '+stops.length+'</div><div class="title">'+st.title+'</div></div></div>'+progress()+'<div class="metrics">'+metric('Product Health',health())+metric('Market Access',state.stats.access)+metric('Timeline',state.stats.timeline)+metric('Profitability',state.stats.profit)+'</div>'+support()+'<div class="scenario">'+st.scene+'</div><div class="prompt">'+st.prompt+'</div><div class="choices">'+choicesHtml+'</div>'+result+'</div>'}
function eventScreen(){var e=state.event;var t=e.tone||'mid';return '<div class="card eventcard '+t+'"><div class="kicker">'+e.kind+'</div><h2>'+e.title+'</h2><p>'+e.text+'</p>'+(e.trigger?'<div class="chip impact">Source debt: '+e.trigger+'</div>':'')+'<div class="chip impact">Impact: '+impactText(e.impact)+'</div>'+(e.clearAll&&state.debt.length?'<div class="chip impact">The audit forces all '+state.debt.length+' open gap(s) closed.</div>':'')+'<button class="btn" onclick="resolve()">Continue</button></div>'}
function doneScreen(){var o=outcome();return '<div class="card endcard '+o.tone+'"><div class="kicker">Final Product Outcome</div><h2>'+o.title+'</h2><p>'+o.text+'</p><div class="chip impact" style="margin-top:10px">Health '+health()+' | Access '+state.stats.access+' | Timeline '+state.stats.timeline+' | Profitability '+state.stats.profit+' | Open Debt '+state.debt.length+'</div><button class="btn" onclick="resetGame()">Play Again</button></div>'}
function startScreen(){return '<div class="wrap"><div class="card startcard"><h2>Philips Regulatory Trail</h2><p class="mission">You are the Regulatory Affairs Specialist for CardioSight.</p><div class="whatcard"><h3>What is CardioSight?</h3><p>CardioSight is a fictional cardiovascular imaging platform used during minimally invasive vascular procedures. It helps physicians visualize blood vessels and is sold in markets around the world.</p><p>You will guide it through its regulatory lifecycle: RPAT, FDA strategy, product change, AI submissions, hardware sustaining, SICR/CDF/SCM, and next-generation planning.</p></div><button class="btn" onclick="startGame()">Begin</button></div></div>'}
function howToPlay(){return '<div class="card startcard"><div class="kicker">Before you start</div><h2 style="font-size:24px">How to Play</h2><div class="whatcard"><p><b>1. Make the call.</b> At each of the 7 checkpoints, choose the regulatory decision you think is best. Weak choices still let you move forward.</p><p><b>2. Watch Product Health.</b> It reflects Market Access, Timeline, and Profitability, plus Evidence, Compliance, Trust, and Risk.</p><p><b>3. Manage Regulatory Debt.</b> Weak choices create debt that lowers health and can surface later as an audit or FDA finding. A scheduled BSI audit near the end forces open gaps closed \u2014 and the more debt you carry, the harder it hits.</p></div><div class="goalbox"><div class="glabel">Your Goal</div><p>Keep CardioSight safely on the market, protect patient access, and finish the lifecycle with the product as healthy as possible.</p></div><button class="btn" onclick="beginJourney()">Start Checkpoint 1</button></div>'}
function render(){var root=document.getElementById('root');root.innerHTML=!state.started?startScreen():state.briefing?frame(howToPlay()):state.done?frame(doneScreen()):state.event?frame(eventScreen()):frame(game())}
render();
</script>
</body>
</html>
