.mid{border-color:#fde68a;background:#fffbeb;color:#78350f}.result.bad,.eventcard.bad,.endcard.bad{border-color:#fecaca;background:#fef2f2;color:#7f1d1d}.result h3{margin:0 0 5px;font-size:18px}.result p{margin:0;font-size:14px;line-height:1.3}.impact,.resolvebox{margin-top:7px;border:1px solid #dbeafe;background:#fff;color:#172554;border-radius:12px;padding:7px;font-size:13px;font-weight:800}.resolvebox{border-color:#bbf7d0;background:#ecfdf5;color:#064e3b}.debtadd{margin-top:7px;border:1px solid #fecaca;background:#fef2f2;color:#7f1d1d;border-radius:12px;padding:7px;font-size:13px;font-weight:800}.side{display:flex;flex-direction:column;padding:11px;gap:9px}.sidebox{border:1px solid #dbeafe;background:#fff;border-radius:18px;padding:11px;min-height:0}.sidebox h3{margin:0 0 8px;font-size:16px}.debtcompact{display:flex;align-items:center;gap:10px}.debtbadge{width:44px;height:44px;border-radius:15px;background:#fef3c7;color:#92400e;display:grid;place-items:center;font-size:24px;font-weight:950}.debtlist{display:flex;flex-direction:column;gap:6px;max-height:178px;overflow:auto;margin-top:8px}.debtitem{border:1px solid #fde68a;background:#fffbeb;color:#78350f;border-radius:12px;padding:7px;font-size:12px;font-weight:800}.resolveditem{border-color:#bbf7d0;background:#ecfdf5;color:#064e3b}.debtmeta{font-weight:600;font-size:11px;color:inherit;margin-top:3px}.recent{font-size:13px;color:#334155;line-height:1.28;max-height:116px;overflow:auto}.stat{display:flex;justify-content:space-between;font-size:13px;margin:7px 0}.good{color:#059669}.warn{color:#d97706}.bad{color:#dc2626}.eventbig{padding:20px;display:grid;place-items:center;flex:1}.eventcard,.endcard{width:min(790px,100%);border:1px solid #bfdbfe;background:#eff6ff;color:#172554;border-radius:26px;padding:28px;text-align:center}.eventcard h2,.endcard h2{font-size:38px;margin:0 0 10px}.eventcard p,.endcard p{font-size:18px;line-height:1.3}.small{font-size:12px;color:#64748b}@media(max-width:900px){body{overflow:auto}. <script>
const START={access:78,timeline:76,profit:74,evidence:58,compliance:64,trust:70,risk:32};
const ICONS={'RPAT & Approval Visibility':'RPAT','FDA Pre-Submission Strategy':'PRE','Product Change Assessment':'CHG','AI Submission Development':'AI','Hardware Sustaining Assessment':'HW','SICR / CDF / SCM Review':'SCM','Next Generation Strategy':'NEXT'};
const stops=[
{id:'rpat',phase:'RPAT & Approval Visibility',title:'RPAT & Approval Visibility',project:'RPAT Gap Assessment',scene:'CardioSight was acquired several years ago and is now being discussed for broader commercial planning. Leadership wants the product added to RPAT so teams can understand shipment eligibility, market availability, and product approval status. Initial review shows the information is not cleanly in one place: product identifiers, approval evidence, IFU ownership, SAP data, legacy records, market assumptions, and Regulatory Operations inputs are spread across systems and owners. One region appears commercially active, but RA cannot yet trace that status to source approval evidence.',prompt:'You are assigned as the RA lead for the RPAT inclusion effort. What recommendation do you give before the request moves forward?',choices:[{tone:'good',label:'Map the RPAT inputs, owners, identifiers, and approval evidence first, then submit once the open assumptions are documented and the entry can be fully traced back to source.',result:'You slow the request slightly, but the team now understands what is known, what is missing, and who owns each blocker. RPAT inclusion becomes a controlled regulatory data activity instead of a rushed administrative request.',impact:{timeline:-3,profit:1,evidence:14,compliance:11,access:5,trust:8,risk:-9},debt:[]},{tone:'mid',label:'Move the request forward while the evidence review runs in parallel, flagging any markets, identifiers, or records that still need confirmation before the entry is finalized.',result:'The team keeps moving, but some assumptions are still open while the request is being built. This is manageable if everyone follows through, but unresolved market evidence may resurface later.',impact:{timeline:4,profit:3,evidence:4,compliance:2,access:2,trust:2,risk:5},debt:['Documentation debt']},{tone:'bad',label:'Use the mature commercial history and existing records to submit now, closing any specific approval or identifier questions quickly if a reviewer later asks for the source.',result:'The request appears efficient at first, but unsupported assumptions now enter the record. If anyone asks for source evidence later, RA will need to reconstruct the approval story under pressure.',impact:{timeline:8,profit:2,evidence:-13,compliance:-12,access:-4,trust:-7,risk:15},debt:['Unsupported approval claim','Missing product data']} ]},
{id:'presub',phase:'FDA Pre-Submission Strategy',title:'FDA Pre-Submission Strategy',project:'IVUS Reprocessing Pre-Sub Support',scene:'A team is preparing a Pre-Submission strategy for a reprocessed IVUS catheter project. The core question is not just whether the product can be reprocessed, but how the team should frame the regulatory questions for FDA. RA needs to think through what evidence is available, what bench or validation information may be needed, how reprocessing could affect device performance or labeling, and which FDA questions would meaningfully reduce uncertainty before the team commits to a larger submission strategy.',prompt:'How should RA structure the FDA Pre-Submission approach?',choices:[{tone:'good',label:'Center the Pre-Submission on the highest-risk uncertainties, presenting the approach and evidence, and asking FDA questions that could change testing, labeling, or submission strategy.',result:'FDA receives a clear package with actionable questions. The team leaves the interaction with feedback that can actually guide evidence planning and reduce later submission uncertainty.',impact:{timeline:-4,profit:-2,evidence:14,compliance:12,access:4,trust:8,risk:-10},debt:[],fda:'strong'},{tone:'mid',label:'Blend several focused questions with broader discussion topics, giving FDA room to react even though some feedback may be harder to translate into direct project decisions.',result:'The team gains useful feedback, but some FDA responses are broad and require interpretation. The strategy remains workable, but RA will need to translate the feedback into clearer internal next steps.',impact:{timeline:-2,profit:-3,evidence:6,compliance:4,trust:3,risk:4},debt:['Pre-Sub package gaps'],fda:'mixed'},{tone:'bad',label:'Keep the questions broad to protect flexibility while development matures, using the meeting mainly to learn FDA expectations before committing to a specific evidence plan.',result:'The interaction happens, but it produces limited direction. FDA cannot give strong feedback because the questions are too broad and the proposed evidence strategy is not specific enough.',impact:{timeline:5,profit:2,evidence:-9,compliance:-7,access:-3,trust:-6,risk:13},debt:['Weak Pre-Sub strategy','Pre-Sub package gaps'],fda:'weak'} ]},
{id:'change',phase:'Product Change Assessment',title:'Product Change Assessment',project:'Regulatory Change Impact Review',scene:'After early FDA strategy discussions, Engineering proposes a significant CardioSight update that could improve workflow efficiency and reduce procedural burden. The business wants to move quickly because the change supports near-term product goals, but RA still needs to determine what is actually changing, whether intended use could be affected, what evidence may be needed, and whether the update creates submission or market-specific implications.',prompt:'How should RA assess the proposed product change before development accelerates?',choices:[{tone:'good',label:'Define the change scope with Engineering before major commitments, comparing it against intended use and existing claims to surface evidence, documentation, and submission impacts.',result:'The team starts with a clearer regulatory path. Development may not feel as fast on day one, but evidence needs, submission assumptions, and decision owners are better aligned before the project becomes harder to redirect.',impact:{timeline:-3,profit:1,evidence:12,compliance:10,access:5,trust:7,risk:-8},debt:[]},{tone:'mid',label:'Let early development continue while RA reviews the highest-risk change elements first, tracking lower-risk documentation and market questions as the design becomes clearer.',result:'The team keeps momentum and catches several major issues, but some regulatory questions remain open while design decisions continue moving. This can work if the deferred items are actively tracked.',impact:{timeline:5,profit:4,evidence:4,compliance:2,access:1,trust:2,risk:6},debt:['Product change scope uncertainty']},{tone:'bad',label:'Move on the existing pathway now to hit the business timeline, expanding the review only if a specific testing, intended-use, or labeling concern actually emerges later.',result:'The project moves quickly, but the regulatory strategy is based on assumptions rather than defined evidence. When the change becomes clearer, RA may discover that key questions should have been addressed earlier.',impact:{timeline:8,profit:3,evidence:-10,compliance:-10,access:-5,trust:-6,risk:14},debt:['Unassessed product change','Product change scope uncertainty']} ]},
{id:'ai',phase:'AI Submission Development',title:'AI Submission Development',project:'AI Pilot Study',scene:'The team is preparing a submission package with testing summaries, regulatory rationale, risk-management information, standards references, and responses to FDA feedback. An AI drafting agent is available to summarize source documents, organize evidence, and draft sections quickly. Early testing shows that the agent can save time, but it may create unsupported statements if the source package is incomplete or if reviewer oversight is weak.',prompt:'What level of AI involvement should RA permit before content enters the submission package?',choices:[{tone:'good',label:'Let AI draft, organize, and summarize while RA owns the final package, requiring each generated claim to trace to source evidence before it becomes submission-ready.',result:'The team gains efficiency without losing accountability. AI speeds up routine drafting and evidence organization, while RA protects traceability, judgment, and final submission quality.',impact:{timeline:12,profit:7,evidence:12,compliance:10,access:5,trust:8,risk:-9},debt:[]},{tone:'mid',label:'Point AI at summaries, tables, and administrative sections while RA writes the highest-risk rationale, protecting quality even though some efficiency gains go unused.',result:'The submission remains well controlled, but the team gains less speed than it could have. This is conservative and defensible, though it may not fully test the value of the AI pilot.',impact:{timeline:5,profit:3,evidence:7,compliance:6,access:2,trust:5,risk:-3},debt:[]},{tone:'bad',label:'Let AI draft most sections to hit the submission date, focusing RA review on the areas that look highest risk and correcting anything reviewers flag afterward.',result:'The package gets drafted quickly, but speed hides quality problems. Unsupported claims and weak traceability begin appearing across sections that were assumed to be low risk.',impact:{timeline:10,profit:-7,evidence:-20,compliance:-18,access:-8,trust:-14,risk:23},debt:['Unverified AI content','Unsupported submission claim']} ]},
{id:'hardware',phase:'Hardware Sustaining Assessment',title:'Hardware Sustaining Assessment',project:'Hardware Sustaining',scene:'PLACEHOLDER_HARDWARE_SCENARIO',prompt:'How should RA support the initial sustaining assessment?',choices:[{tone:'good',label:'Run a structured sustaining review before implementation. Cover intended use, affected configurations, evidence needs, standards, certification, documentation, and market-specific implications.',result:'RA treats the sustaining change as more than a parts swap. The team understands the regulatory impact, evidence needs, and certification exposure before the change is pushed into implementation.',impact:{timeline:-4,profit:-1,evidence:14,compliance:13,access:6,trust:8,risk:-10},debt:[]},{tone:'mid',label:'Prioritize the highest-risk sustaining questions first. Review affected systems, certification-sensitive items, and likely submission exposure, while tracking lower-risk documentation and country questions.',result:'The review is practical and keeps the project moving, but some lower-risk items are carried forward. If ownership is clear, this can work, but unresolved sustaining details may still return later.',impact:{timeline:5,profit:4,evidence:5,compliance:3,access:2,trust:2,risk:6},debt:['Deferred sustaining review']},{tone:'bad',label:'Treat the change as low impact because Engineering expects functional equivalence. Use prior sustaining work as support and expand the review only if certification, documentation, or market questions appear.',result:'The team moves quickly, but the regulatory review is too narrow. Functional equivalence does not automatically answer certification, technical documentation, standards, or country-specific questions.',impact:{timeline:8,profit:3,evidence:-10,compliance:-12,access:-7,trust:-8,risk:16},debt:['Certification impact unknown','Deferred sustaining review']} ]},
{id:'sicr',phase:'SICR / CDF / SCM Review',title:'SICR / CDF / SCM Review',project:'Hardware Sustaining Deep Dive',scene:'As the sustaining work continues, a related SICR is opened and the team needs RA input. The issue appears manageable, but it may become a formal Change Request, affect CDF documentation, require certification review, influence Standards and Compliance Matrix updates, or create country-specific regulatory impact. The challenge is deciding how much risk to document now versus waiting for Engineering to clarify the implementation details.',prompt:'How should RA evaluate the SICR, CDF, and SCM impact?',choices:[{tone:'good',label:'Capture the SICR in a structured impact table covering CR likelihood, CDF impact, certification or NRTL exposure, SCM updates, affected systems, documentation, and global submission risk.',result:'The team can see both the current state and the downstream risk. SICR/CDF work becomes traceable, and future reviewers can understand why RA judged the issue as low, medium, or high impact.',impact:{timeline:-4,profit:-2,evidence:15,compliance:15,access:6,trust:9,risk:-11},debt:[]},{tone:'mid',label:'Hold the SICR as potentially high impact until Engineering clarifies the path, handling CDF and certification-sensitive items first and updating SCM and country views as details mature.',result:'The team avoids missing a serious regulatory issue, but the review may become heavier than necessary. This is defensible if the open questions are tracked and closed deliberately.',impact:{timeline:-7,profit:-5,evidence:9,compliance:9,access:3,trust:3,risk:-5},debt:['SCM impact gap']},{tone:'bad',label:'Keep the SICR open at low impact so the team is not slowed, taking on the detailed CDF, SCM, certification, and global review once a Change Request actually confirms the change.',result:'RA delays the hardest questions until the change is already moving. CDF, SCM, certification, or country-submission concerns may appear later under schedule pressure.',impact:{timeline:6,profit:2,evidence:-10,compliance:-12,access:-6,trust:-7,risk:15},debt:['CDF impact underestimated','SCM impact gap','Global submission exposure unclear']} ]},
{id:'future',phase:'Next Generation Strategy',title:'Next Generation Strategy',project:'Project Alfred and Lifecycle Planning',scene:'CardioSight remains commercially important, but leadership is considering longer-term platform decisions. Competitors are moving, customers expect better connectivity and workflow integration, and Engineering is exploring future concepts that may or may not belong in the current product lifecycle. Some ideas could be sustaining updates, while others may require a next-generation platform, new evidence, new standards analysis, cybersecurity review, or a separate regulatory pathway.',prompt:'How should RA support the long-term next-generation recommendation?',choices:[{tone:'good',label:'Separate current support from future platform decisions in one lifecycle strategy, weighing technology impact, evidence burden, cybersecurity, standards, market value, and transition timing.',result:'Leadership receives a clearer roadmap. RA connects current product support with future strategy instead of treating sustaining work and innovation as competing priorities.',impact:{timeline:-3,profit:4,evidence:11,compliance:11,access:9,trust:9,risk:-9},debt:[]},{tone:'mid',label:'Continue current support while Engineering matures the concepts, tracking known regulatory questions now but waiting for stronger technical definition before major pathway calls.',result:'The team avoids over-analyzing early ideas, but RA enters future planning later than ideal. Some strategic options may narrow before regulatory complexity is fully understood.',impact:{timeline:3,profit:4,evidence:3,compliance:2,access:4,trust:2,risk:5},debt:['Future strategy assumption']},{tone:'bad',label:'Hold regulatory effort until leadership funds a concept, then address technology, standards, cybersecurity, and market pathway questions once the portfolio direction is actually set.',result:'The portfolio discussion moves forward without enough regulatory input. Future teams may inherit assumptions that are expensive to unwind.',impact:{timeline:7,profit:-5,evidence:-9,compliance:-11,access:-7,trust:-7,risk:15},debt:['Future strategy assumption']} ]}
];
const hardwareVariants=[
{title:'EOL Component',scene:'A critical processing-board component used in CardioSight has reached end of life. Engineering identified a replacement that appears electrically equivalent and expects minimal software impact. Procurement wants a quick decision because remaining inventory is limited. A related SICR has been opened to document the issue and determine whether it could become a Change Request, affect certification files, require CDF updates, or update technical documentation.',prompt:'How should RA handle the end-of-life component replacement?',choices:[{tone:'good',label:'Compare the replacement against the original component for electrical, safety, and design equivalence, then confirm certification files, verification evidence, and affected market documentation before releasing the change.',result:'RA confirms whether the replacement is truly equivalent and where certification or documentation must be updated. The change moves a bit slower but avoids a hidden compliance gap.',impact:{timeline:-4,profit:-1,evidence:13,compliance:12,access:5,trust:7,risk:-9},debt:[]},{tone:'mid',label:'Approve the replacement for the most inventory-critical configurations first, confirming certification-sensitive evidence now and updating lower-risk documentation and market files afterward.',result:'The supply risk eases and the biggest certification questions are handled, but some documentation and market updates are still open and must be tracked to closure.',impact:{timeline:4,profit:4,evidence:4,compliance:3,access:2,trust:2,risk:6},debt:['Deferred sustaining review']},{tone:'bad',label:'Accept the replacement now on the strength of electrical equivalence to protect the build schedule, opening a certification and documentation review only if a later question comes up.',result:'Production keeps running, but equivalence does not automatically clear certification files, technical documentation, or market records. Those questions can resurface as rework.',impact:{timeline:8,profit:4,evidence:-9,compliance:-11,access:-6,trust:-7,risk:15},debt:['Certification impact unknown','Deferred sustaining review']}]},
{title:'Supplier Change',scene:'A qualified supplier for a critical CardioSight subassembly is exiting the market. Procurement found an alternate supplier using the same drawings and specifications, but supplier qualification records and regulatory documentation may still be affected. A related SICR asks whether the change carries certification or documentation impact.',prompt:'How should RA handle the supplier transition?',choices:[{tone:'good',label:'Confirm supplier qualification, design and specification continuity, verification impact, certification files, and affected market documentation before the alternate supplier is approved for production.',result:'RA keeps the supply path moving while confirming the supporting evidence and certifications remain defensible under the new supplier.',impact:{timeline:-3,profit:-1,evidence:12,compliance:12,access:5,trust:7,risk:-9},debt:[]},{tone:'mid',label:'Approve the alternate supplier for urgent supply needs while supplier qualification, certification, and country documentation updates are completed as tracked follow-up actions.',result:'Supply continuity is protected and the design is unchanged, but qualification and documentation follow-up remains open and depends on disciplined tracking.',impact:{timeline:4,profit:5,evidence:3,compliance:2,access:2,trust:1,risk:6},debt:['Deferred sustaining review']},{tone:'bad',label:'Treat the supplier swap as administrative since the drawings and specifications are unchanged, keeping production on schedule and revisiting documentation only if an auditor asks.',result:'The design may not change, but the supporting evidence trail can. Supplier, quality, certification, and market documentation questions can surface later as findings.',impact:{timeline:8,profit:4,evidence:-8,compliance:-11,access:-6,trust:-6,risk:14},debt:['Certification impact unknown','Deferred sustaining review']}]},
{title:'Manufacturing Transfer',scene:'Manufacturing wants to move part of the CardioSight build process to another facility. The product design is not intended to change, but process location, validation records, quality documentation, certification evidence, and market files may be affected. A related SICR asks whether the transfer creates documentation or certification impact.',prompt:'How should RA support the manufacturing transfer?',choices:[{tone:'good',label:'Assess process validation, site qualification, quality records, certification evidence, technical documentation, and market notification needs before the transfer is implemented.',result:'RA separates true design impact from manufacturing and documentation obligations. The transfer takes longer but the regulatory trail stays strong.',impact:{timeline:-4,profit:-1,evidence:12,compliance:13,access:5,trust:7,risk:-9},debt:[]},{tone:'mid',label:'Support the transfer in phases, clearing validation and certification-sensitive documentation first while lower-risk quality and market records are completed during ramp-up.',result:'The transfer progresses steadily and the key validation questions are handled, but some evidence reviews remain open and need careful tracking.',impact:{timeline:4,profit:4,evidence:4,compliance:3,access:2,trust:1,risk:6},debt:['Deferred sustaining review']},{tone:'bad',label:'Proceed with the transfer since the design is unchanged, keeping the site move on schedule and treating validation and certification review as needed only if issues appear.',result:'A transfer can affect more than design. Process validation, certification records, and market files may still need review, which can return as rework.',impact:{timeline:8,profit:4,evidence:-8,compliance:-12,access:-6,trust:-6,risk:15},debt:['Certification impact unknown','Deferred sustaining review']}]},
{title:'Alternate Component',scene:'Engineering proposes an alternate component to reduce supply risk. The component is not clinically visible to users, but it may still affect verification evidence, electrical safety documentation, standards compliance, technical files, or global registrations. The related SICR is currently viewed as low priority.',prompt:'How should RA handle the alternate component proposal?',choices:[{tone:'good',label:'Evaluate component equivalence, affected verification, safety evidence, standards or certification impact, technical documentation, and market registrations before the alternate part is released.',result:'RA avoids assuming low clinical visibility means low regulatory impact, and creates a defensible basis for implementing the alternate component.',impact:{timeline:-3,profit:-1,evidence:12,compliance:11,access:5,trust:7,risk:-8},debt:[]},{tone:'mid',label:'Clear the verification and certification-sensitive questions first so the part can be used, then complete lower-risk documentation and country assessments as follow-up items.',result:'The most important risks are handled early and the part becomes usable, but follow-up documentation remains open and depends on clear ownership.',impact:{timeline:4,profit:4,evidence:4,compliance:3,access:2,trust:1,risk:6},debt:['Deferred sustaining review']},{tone:'bad',label:'Approve the alternate part since it is hidden from users and expected to function the same, protecting supply and expanding the review only if a standards or market question arises.',result:'A hidden component can still affect evidence, standards, documentation, and certifications. The team may need to rework the assessment after implementation begins.',impact:{timeline:8,profit:4,evidence:-8,compliance:-10,access:-6,trust:-6,risk:14},debt:['Certification impact unknown','Deferred sustaining review']}]}];
const debtInfo={'Documentation debt':['rpat','RPAT & Approval Visibility','Can trigger an audit finding if records are challenged.'],'Unsupported approval claim':['rpat','RPAT & Approval Visibility','Can trigger an audit finding or market access question.'],'Missing product data':['rpat','RPAT & Approval Visibility','Can block or delay RPAT readiness.'],'Weak Pre-Sub strategy':['presub','FDA Pre-Submission Strategy','Can trigger FDA clarification later.'],'Pre-Sub package gaps':['presub','FDA Pre-Submission Strategy','Can make FDA feedback less actionable.'],'Product change scope uncertainty':['change','Product Change Assessment','Can weaken the product change path.'],'Unassessed product change':['change','Product Change Assessment','Can force product change strategy rework.'],'Unverified AI content':['ai','AI Submission Development','Can trigger submission quality questions.'],'Unsupported submission claim':['ai','AI Submission Development','Can trigger FDA rework or unsupported rationale concerns.'],'Deferred sustaining review':['hardware','Hardware Sustaining Assessment','Can trigger follow-up review if low-risk items become important.'],'Certification impact unknown':['hardware','Hardware Sustaining Assessment','Can trigger certification or standards rework.'],'CDF impact underestimated':['sicr','SICR / CDF / SCM Review','Can trigger CDF or CR reassessment.'],'SCM impact gap':['sicr','SICR / CDF / SCM Review','Can create standards or documentation follow-up.'],'Global submission exposure unclear':['sicr','SICR / CDF / SCM Review','Can trigger country-specific submission review.'],'Future strategy assumption':['future','Next Generation Strategy','Can reduce final product health if next-generation planning is weak.']};
let state={started:false,briefing:false,idx:0,stats:{...START},selected:null,debt:[],resolvedDebt:[],event:null,recent:'No events yet.',randomSeen:0,randomLimit:2,done:false,orders:[],reworks:0,triggered:0,presubChoice:null,fdaFeedbackDone:false,approvalDone:false,hardwareVariant:null,timelineTriggered:false,execTriggered:false,lastResolved:[]};
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}function apply(s,i){return{access:clamp(s.access+(i.access||0)),timeline:clamp(s.timeline+(i.timeline||0)),profit:clamp(s.profit+(i.profit||0)),evidence:clamp(s.evidence+(i.evidence||0)),compliance:clamp(s.compliance+(i.compliance||0)),trust:clamp(s.trust+(i.trust||0)),risk:clamp(s.risk+(i.risk||0))}}function debtScore(){return state.debt.length+(state.stats.risk>65?2:0)+(state.stats.evidence<50?2:0)+(state.stats.compliance<50?2:0)}function health(){let s=state.stats,core=s.access*.4+s.timeline*.3+s.profit*.3,support=(s.evidence+s.compliance+s.trust+(100-s.risk))/4;return clamp(core+(support-50)*.12-state.debt.length*2)}function openDebtNames(){return state.debt.map(d=>d.name)}function addDebt(items,source){(items||[]).forEach(name=>{let info=debtInfo[name]||[source,source,'Future review pressure.'];if(!state.debt.some(d=>d.name===name))state.debt.push({name,source,clearAt:info[0],resolutionPath:info[1],consequence:info[2],activated:false});})}function clearDebtForStop(stopId,tone){state.lastResolved=[];if(!['good','mid'].includes(tone))return;let keep=[];for(let d of state.debt){if(d.clearAt===stopId){state.resolvedDebt.push({...d,resolvedAt:stopId,resolvedPath:d.resolutionPath});state.lastResolved.push(d.name)}else keep.push(d)}state.debt=keep;if(state.lastResolved.length){state.stats=apply(state.stats,{timeline:-2,profit:-1,trust:2,risk:-3});state.recent='Debt resolved: '+state.lastResolved.join(', ');}}
function activeStop(){let st={...stops[state.idx]};if(st.id==='hardware'&&state.hardwareVariant){st.title=state.hardwareVariant.title;st.scene=state.hardwareVariant.scene;st.prompt=state.hardwareVariant.prompt||st.prompt;st.choices=state.hardwareVariant.choices}return st}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function initOrders(){state.hardwareVariant=hardwareVariants[Math.floor(Math.random()*hardwareVariants.length)];state.orders=stops.map(s=>{let n=(s.id==='hardware'&&state.hardwareVariant)?state.hardwareVariant.choices.length:s.choices.length;return shuffle([...Array(n).keys()])});state.randomLimit=Math.random()<.55?2:3}
const debtRules=[{match:['Documentation debt','Unsupported approval claim','Missing product data'],title:'REGULATORY DEBT ACTIVATED: AUDIT FINDING',text:'A record created earlier cannot be supported when evidence is requested. The issue can be cleared by returning to the RPAT and approval visibility decision and fixing the evidence trail.',impact:{access:-10,timeline:-9,profit:-6,evidence:-7,compliance:-8,trust:-7,risk:12},backTo:'rpat',tone:'bad'},{match:['Weak Pre-Sub strategy','Pre-Sub package gaps'],title:'REGULATORY DEBT ACTIVATED: FDA CLARIFICATION REQUEST',text:'FDA asks questions the team thought were already handled. The Pre-Submission strategy can be corrected by returning to the Pre-Sub decision with more focused questions and a clearer evidence plan.',impact:{access:-4,timeline:-10,profit:-7,evidence:-5,compliance:-6,trust:-6,risk:10},backTo:'presub',tone:'bad'},{match:['Product change scope uncertainty','Unassessed product change'],title:'REGULATORY DEBT ACTIVATED: PRODUCT CHANGE REWORK',text:'The change definition was not strong enough. Return to the product change assessment and clarify intended use, evidence needs, and possible submission impact.',impact:{access:-5,timeline:-10,profit:-7,evidence:-5,compliance:-6,trust:-6,risk:10},backTo:'change',tone:'bad'},{match:['Unverified AI content','Unsupported submission claim'],title:'REGULATORY DEBT ACTIVATED: SUBMISSION QUALITY QUESTION',text:'An unsupported claim becomes a submission problem. Rework can clear the debt if the package is verified and the evidence trail is strengthened.',impact:{access:-12,timeline:-12,profit:-10,evidence:-12,compliance:-11,trust:-10,risk:14},backTo:'ai',tone:'bad'},{match:['Certification impact unknown','Deferred sustaining review'],title:'REGULATORY DEBT ACTIVATED: CERTIFICATION REWORK',text:'A sustaining assumption turns into certification or documentation rework. A structured reassessment can clear the open risk before implementation continues.',impact:{access:-9,timeline:-10,profit:-8,evidence:-7,compliance:-9,trust:-7,risk:11},backTo:'hardware',tone:'bad'},{match:['CDF impact underestimated','SCM impact gap','Global submission exposure unclear'],title:'REGULATORY DEBT ACTIVATED: CDF / SCM REWORK',text:'A SICR, CDF, SCM, or country-impact assumption becomes a downstream regulatory issue. Return to the SICR/CDF/SCM review and document the impact clearly.',impact:{access:-10,timeline:-10,profit:-8,evidence:-8,compliance:-10,trust:-7,risk:12},backTo:'sicr',tone:'bad'}];
const randomEvents=[{title:'BSI AUDIT',text:'A BSI auditor requests approval traceability, change rationale, evidence history, and risk documentation. The audit targets whether CardioSight decisions are supported by records, not whether the team can explain them verbally.',impact:{timeline:-7,profit:-4,evidence:-4,compliance:-4,trust:-3,risk:6},goodIf:(s,d)=>d.length<2&&s.evidence>68&&s.compliance>65,goodText:'The auditor asks for the file everyone feared, and it is actually there. Minor findings only.',goodImpact:{timeline:-2,compliance:2,trust:3,risk:-2},badIf:(s,d)=>d.length>=3||s.evidence<45||s.compliance<45,badText:'The auditor targets a weak trail. Major finding, but the finding can be corrected through rework.',badImpact:{access:-10,timeline:-10,profit:-7,evidence:-7,compliance:-8,trust:-8,risk:12}},{title:'MARKET COMMUNICATION PRESSURE',text:'A commercial team wants to communicate availability or launch timing before every supporting activity is closed. RA must help the team move without overpromising market access.',impact:{access:-4,timeline:-3,profit:2,trust:-3,risk:5},goodIf:(s,d)=>d.length<2&&s.evidence>65,goodText:'RA supports a controlled message that avoids unsupported market claims while still helping the business communicate responsibly.',goodImpact:{timeline:1,profit:2,trust:2,risk:-1}},{title:'NEW STANDARDS RELEASE',text:'A relevant standard is updated. RA screens whether technical documentation, future submissions, certifications, or standards and compliance matrices are affected.',impact:{timeline:-7,profit:-5,compliance:-4,risk:6},goodIf:(s,d)=>s.compliance>72,goodText:'Compliance tracking is strong. The standards screening is quick, and the team understands whether additional work is needed.',goodImpact:{timeline:-2,compliance:3,risk:-2}},{title:'COMPETITOR LAUNCH',text:'A competitor launches a next-generation platform. Leadership asks why CardioSight is not moving faster and whether regulatory activities are creating avoidable delay.',impact:{timeline:-6,profit:-4,trust:-3,risk:6},goodIf:(s,d)=>s.risk<42&&s.trust>65,goodText:'Your risk position supports a focused response. RA can explain what is slowing the program and what is protecting market access.',goodImpact:{timeline:2,profit:1,trust:2,risk:-1}}];
function timelinePressureEvent(){return {title:'TIMELINE PRESSURE',text:'The schedule is slipping. Leadership asks what can be reduced or deferred without putting market access at risk.',impact:{timeline:-4,profit:-2,trust:-4,risk:5},kind:'Triggered Event',tone:'mid'}}function executiveReviewEvent(){return {title:'THE VP WANTS ANSWERS',text:'A VP joins because the trail has become risky. Good documentation protects decisions; weak documentation exposes them.',impact:{timeline:-3,profit:-2,trust:-8,risk:4},kind:'Triggered Event',tone:'bad',trigger:'Low trust, high risk, low timeline, or excessive open debt triggered review'}}
function fdaPreSubFeedback(){let d=debtScore(),s=state.stats,p=state.presubChoice,td=state.debt.length?' Active open debt reviewed: '+state.debt[state.debt.length-1].name+'.':'';if(p==='strong'&&d<=2&&s.evidence>=62)return {title:'FDA FEEDBACK: GENERALLY AGREES',text:'FDA generally agrees with the proposed approach because the questions, evidence, and rationale are clear.'+td,impact:{timeline:2,evidence:3,compliance:3,trust:5,risk:-6},kind:'FDA Feedback',tone:'good'};if(d<=4||p==='mixed')return {title:'FDA FEEDBACK: PARTIALLY AGREES',text:'FDA agrees with portions of the approach but requests clarification on supporting evidence, traceability, or submission rationale before fully supporting the strategy.'+td,impact:{timeline:-6,profit:-4,evidence:-2,trust:1,risk:5},kind:'FDA Feedback',tone:'mid'};if(d<=6)return {title:'FDA FEEDBACK: MORE SUPPORT REQUESTED',text:'FDA believes additional evidence is needed before supporting the strategy.'+td,impact:{timeline:-10,profit:-8,evidence:-5,compliance:-4,trust:-4,risk:10},kind:'FDA Feedback',tone:'bad'};return {title:'FDA FEEDBACK: APPROACH NOT SUPPORTED',text:'FDA does not agree with the proposed pathway because the package does not yet provide enough support for the strategy.'+td,impact:{access:-4,timeline:-14,profit:-10,evidence:-8,compliance:-8,trust:-9,risk:14},kind:'FDA Feedback',trigger:'Open debt affected FDA feedback',backTo:'strategy',tone:'bad'}}
function fdaApprovalDecision(){let d=debtScore(),s=state.stats,td=state.debt.length?' Review pressure came partly from: '+state.debt[state.debt.length-1].name+'.':'';if(d<=2&&s.evidence>=70&&s.compliance>=68)return {title:'FDA DECISION: APPROVED',text:'FDA agrees the submission supports the change because the evidence, traceability, and regulatory rationale are strong.'+td,impact:{access:10,timeline:3,profit:4,trust:6,risk:-8},kind:'FDA Decision',tone:'good'};if(d<=4&&s.evidence>=58)return {title:'FDA DECISION: APPROVED WITH QUESTIONS',text:'FDA supports the submission but requests clarification on specific evidence links, rationale, or package details.'+td,impact:{access:2,timeline:-6,profit:-4,evidence:-2,trust:1,risk:4},kind:'FDA Decision',tone:'mid'};if(d<=6)return {title:'FDA DECISION: ADDITIONAL EVIDENCE NEEDED',text:'FDA believes portions of the submission require additional support before the change can be fully supported.'+td,impact:{access:-5,timeline:-12,profit:-9,evidence:-5,compliance:-4,trust:-5,risk:10},kind:'FDA Decision',tone:'bad'};return {title:'FDA DECISION: NOT SUPPORTED',text:'FDA determines the evidence package does not support the approach. The concern is submission quality and support, not how quickly the package was drafted.'+td,impact:{access:-14,timeline:-16,profit:-13,evidence:-10,compliance:-10,trust:-12,risk:16},kind:'FDA Decision',trigger:'Open debt affected approval',backTo:'ai',tone:'bad'}}
function randomEvent(){let pool=shuffle(randomEvents);let e=pool[state.randomSeen%pool.length];let bad=e.badIf&&e.badIf(state.stats,state.debt);let good=e.goodIf&&e.goodIf(state.stats,state.debt);return {title:e.title,text:bad?e.badText:(good?e.goodText:e.text),impact:bad?e.badImpact:(good?e.goodImpact:e.impact),kind:good?'Prepared Response':'Random Event',trigger:bad?'Open regulatory debt affected event outcome':null,tone:bad?'bad':good?'good':'mid'}}function triggered(){let names=openDebtNames();for(let r of debtRules){let hit=r.match.find(x=>names.includes(x));if(hit){let d=state.debt.find(x=>x.name===hit);if(d&&d.activated)continue;if(d)d.activated=true;return {...r,trigger:hit,kind:'Triggered Consequence'}}}return null}
function outcome(){let h=health(),s=state.stats,d=state.debt.length,r=state.resolvedDebt.length;let why='Open debt: '+d+'. Resolved debt: '+r+'. Triggered consequences: '+state.triggered+'. Rework events: '+state.reworks+'.';if(s.access<=12||s.timeline<=12||s.profit<=12||s.trust<=5||s.risk>=96)return {title:'LinkedIn Update Required',text:'Leadership has scheduled a 15-minute meeting. There is no agenda. HR is attending. '+why+' Time to update your LinkedIn profile.',tone:'bad'};if(h>=90&&d===0&&state.triggered===0)return {title:'Gold Standard',text:'FDA, auditors, leadership, and the product team are all happy. '+why+' This may be your greatest achievement.',tone:'good'};if(h>=76&&d<=2)return {title:'Global Success',text:'CardioSight completed the lifecycle with manageable rework and strong product health. '+why,tone:'good'};if(h>=58||state.triggered>=2)return {title:'Regulatory Firefighter',text:'The product survived because you resolved issues before they became fatal. '+why+' You deserve a vacation.',tone:'mid'};return {title:'Product at Risk',text:'The product remains on market, but significant open regulatory concerns remain. '+why+' Future teams will inherit these issues.',tone:'bad'}}
function checkDone(){let s=state.stats;if(s.access<=12||s.timeline<=12||s.profit<=12||s.trust<=5||s.risk>=96)state.done=true}function startGame(){state.started=true;state.briefing=true;initOrders();render()}function beginJourney(){state.briefing=false;render()}function resetGame(){state={started:false,briefing:false,idx:0,stats:{...START},selected:null,debt:[],resolvedDebt:[],event:null,recent:'No events yet.',randomSeen:0,randomLimit:2,done:false,orders:[],reworks:0,triggered:0,presubChoice:null,fdaFeedbackDone:false,approvalDone:false,hardwareVariant:null,timelineTriggered:false,execTriggered:false,lastResolved:[]};render()}function choose(displayIndex){if(state.selected||state.event||state.done)return;let st=activeStop();let actual=state.orders[state.idx][displayIndex];let ch=st.choices[actual];state.stats=apply(state.stats,ch.impact);clearDebtForStop(st.id,ch.tone);addDebt(ch.debt,st.phase);state.selected={...ch,index:displayIndex,actual};if(st.id==='presub')state.presubChoice=ch.fda;state.recent=st.phase+': '+ch.result;checkDone();render()}function advance(i){state.idx=i}function next(){state.selected=null;if(state.done){render();return}let current=activeStop();if(current.id==='presub'&&!state.fdaFeedbackDone){state.event=fdaPreSubFeedback();state.fdaFeedbackDone=true;render();return}if(current.id==='ai'&&!state.approvalDone){state.event=fdaApprovalDecision();state.approvalDone=true;render();return}if(!state.timelineTriggered&&state.stats.timeline<48){state.event=timelinePressureEvent();state.timelineTriggered=true;render();return}if(!state.execTriggered&&(debtScore()>=6||state.stats.risk>72||state.stats.trust<42)){state.event=executiveReviewEvent();state.execTriggered=true;render();return}let debtNow=state.debt.some(d=>!d.activated)&&(state.idx===1||state.idx===2||state.idx===3||state.idx===4||state.idx===5);let randomNow=state.randomSeen<state.randomLimit&&state.idx<stops.length-1&&(state.idx%2===0||Math.random()<0.28);if(debtNow){let ev=triggered();if(ev){state.event=ev;render();return}}if(randomNow){state.event=randomEvent();state.randomSeen++;render();return}if(state.idx>=stops.length-1)state.done=true;else advance(state.idx+1);render()}function resolve(){let e=state.event;if(!e)return;state.stats=apply(state.stats,e.impact);state.recent=e.title+': '+e.text;if(e.trigger)state.triggered++;checkDone();if(!state.done){if(e.backTo){let b=stops.findIndex(s=>s.id===e.backTo);if(b>=0&&b<state.idx){advance(b);state.reworks++}}else if(state.idx>=stops.length-1)state.done=true;else advance(state.idx+1)}state.event=null;render()}
function statClass(v,rev=false){return rev?(v>70?'bad':v>45?'warn':'good'):(v>70?'good':v>45?'warn':'bad')}function metric(label,value,rev=false){let c=statClass(value,rev);return '<div class="metric"><b>'+label+'</b><div class="num '+c+'">'+value+'</div><div class="bar"><div class="fill" style="width:'+value+'%;background:'+(c==='good'?'#059669':c==='warn'?'#d97706':'#dc2626')+'"></div></div></div>'}function impactText(i){let out=[];for(let k of ['access','timeline','profit','evidence','compliance','trust','risk'])if(i[k])out.push(k[0].toUpperCase()+k.slice(1)+' '+(i[k]>0?'+':'')+i[k]);return out.join(' | ')}
function startScreen(){return '<div class="startApp"><div class="startcard"><h2>Philips Regulatory Trail</h2><p class="mission">You are the Regulatory Affairs Specialist for CardioSight. Keep the product on market, profitable, and on schedule.</p><div class="whatcard"><h3>What is CardioSight?</h3><p>CardioSight is a fictional cardiovascular imaging platform used during minimally invasive vascular procedures. The system helps physicians visualize and assess blood vessels, supports clinical decision making, and is sold in markets around the world.</p><p>As the Regulatory Affairs Specialist supporting CardioSight, you are responsible for helping the product remain on the market while navigating product changes, FDA interactions, global approvals, hardware sustaining activities, and future technology planning.</p><p>Every decision affects product health, market access, profitability, and regulatory risk.</p></div><button class="btn" style="font-size:20px;padding:18px 34px" onclick="startGame()">Begin Regulatory Journey</button></div></div>'}
function briefingScreen(){return '<div class="game"><section class="main"><div class="head"><div class="phaseicon">BRF</div><div><div class="kicker">Mission Briefing</div><div class="title">CardioSight Regulatory Briefing</div><div class="small" style="color:#e0f2fe">A short setup before Checkpoint 1</div></div><div class="pill">CardioSight</div></div><div class="eventbig"><div class="endcard"><h2>CardioSight Regulatory Briefing</h2><p>CardioSight is entering a period of significant change. Leadership wants better visibility into approvals and market access, Engineering is proposing product updates, new technologies are being evaluated, and competitors continue to raise expectations.</p><p>Throughout the game your decisions will affect Market Access, Timeline, Profitability, Evidence, Compliance, Trust, and Regulatory Risk.</p><p>Poor decisions may create Regulatory Debt. Open debt can trigger FDA questions, audits, executive reviews, certification concerns, or project rework. Strong decisions can resolve debt and improve product health.</p><p><b>Your objective is simple: Keep CardioSight on the market and prepare it for the future.</b></p><button class="btn" onclick="beginJourney()">Begin Journey</button></div></div></section>'+side()+'</div>'}
function shell(inner){return '<div class="app"><header class="top"><div class="brand"><h1>Philips Regulatory Trail</h1><div class="sub">CardioSight Regulatory Lifecycle Simulation</div></div><button class="btn secondary" onclick="resetGame()">Reset</button></header><main class="screen">'+inner+'</main></div>'}function side(){let open=state.debt.length?state.debt.map(d=>'<div class="debtitem">'+d.name+(d.activated?' (activated)':'')+'<div class="debtmeta">Created: '+d.source+'</div><div class="debtmeta">Resolution Path: '+d.resolutionPath+'</div><div class="debtmeta">Possible consequence: '+d.consequence+'</div></div>').join(''):'<div class="small">No open items</div>';let resolved=state.resolvedDebt.length?state.resolvedDebt.slice(-3).map(d=>'<div class="debtitem resolveditem">Resolved: '+d.name+'<div class="debtmeta">Resolved through: '+d.resolvedPath+'</div></div>').join(''):'';return '<aside class="side"><div class="sidebox"><h3>Regulatory Debt</h3><div class="debtcompact"><div class="debtbadge">'+state.debt.length+'</div><div class="small">Open debt can trigger once. Resolved debt no longer punishes you.</div></div><div class="debtlist">'+open+resolved+'</div></div><div class="sidebox"><h3>Recent</h3><div class="recent">'+state.recent+'</div></div><div class="sidebox"><h3>Support Metrics</h3><div class="stat"><b>Evidence</b><span class="'+statClass(state.stats.evidence)+'">'+state.stats.evidence+'</span></div><div class="stat"><b>Compliance</b><span class="'+statClass(state.stats.compliance)+'">'+state.stats.compliance+'</span></div><div class="stat"><b>Trust</b><span class="'+statClass(state.stats.trust)+'">'+state.stats.trust+'</span></div><div class="stat"><b>Risk</b><span class="'+statClass(state.stats.risk,true)+'">'+state.stats.risk+'</span></div><div class="stat"><b>Open Debt</b><span>'+state.debt.length+'</span></div><div class="stat"><b>Resolved Debt</b><span>'+state.resolvedDebt.length+'</span></div><div class="stat"><b>Rework</b><span>'+state.reworks+'</span></div></div></aside>'}
function header(st){return '<div class="head"><div class="phaseicon">'+(ICONS[st.phase]||'GO')+'</div><div><div class="kicker">Checkpoint '+(state.idx+1)+' of '+stops.length+' - '+st.phase+'</div><div class="title">'+st.title+'</div><div class="progressline">'+stops.map((_,i)=>'<span class="progdot '+(i<=state.idx?'on':'')+'"></span>').join('')+'</div></div><div class="pill">'+st.project+'</div></div>'}function game(){let st=activeStop();let order=state.orders[state.idx]||[0,1,2];return '<div class="game"><section class="main">'+header(st)+'<div class="content"><div class="dashboard">'+metric('Product Health',health())+metric('Market Access',state.stats.access)+metric('Timeline',state.stats.timeline)+metric('Profitability',state.stats.profit)+'</div><div class="scenario"><div class="kicker" style="color:#64748b">Scenario</div><p>'+st.scene+'</p></div><div><h2 class="prompt">'+st.prompt+'</h2><div class="choices">'+order.map((actual,display)=>'<button class="choice '+(state.selected&&state.selected.index===display?'selected':'')+' '+(state.selected&&state.selected.index!==display?'disabled':'')+'" '+(state.selected?'disabled':'')+' onclick="choose('+display+')">'+st.choices[actual].label+'</button>').join('')+'</div></div>'+(state.selected?'<div class="result '+(state.selected.tone||'mid')+'"><h3>'+(state.selected.tone==='good'?'Good Outcome':state.selected.tone==='bad'?'Bad Outcome':'Mixed Outcome')+'</h3><p>'+state.selected.result+'</p><div class="impact">Impact: '+impactText(state.selected.impact)+'</div>'+(state.lastResolved.length?'<div class="resolvebox">Debt resolved: '+state.lastResolved.join(', ')+'<br>Resolution cost applied, but this debt will no longer punish future decisions.</div>':'')+(state.selected.debt&&state.selected.debt.length?'<div class="debtadd">Regulatory Debt added: '+state.selected.debt.join(', ')+'</div>':'')+'<button class="btn" style="margin-top:9px" onclick="next()">'+(state.idx>=stops.length-1?'Finish':'Continue')+'</button></div>':'')+'</div></section>'+side()+'</div>'}
function eventScreen(){let e=state.event;return '<div class="game"><section class="main"><div class="head"><div class="phaseicon">!</div><div><div class="kicker">'+e.kind+'</div><div class="title">'+e.title+'</div><div class="small" style="color:#e0f2fe">Triggered debt creates rework, but can be cleared by following its Resolution Path.</div></div><div class="pill">Health '+health()+'%</div></div><div class="eventbig"><div class="eventcard '+(e.tone||'mid')+'"><h2>'+e.title+'</h2><p>'+e.text+'</p>'+(e.trigger?'<p><b>Source:</b> '+e.trigger+'</p>':'')+'<p><b>Impact:</b> '+impactText(e.impact)+'</p>'+(e.backTo?'<p><b>Consequence:</b> Rework required. Choose a stronger path to resolve the open debt.</p>':'')+'<button class="btn" onclick="resolve()">Continue</button></div></div></section>'+side()+'</div>'}function doneScreen(){let o=outcome();return '<div class="game"><section class="main"><div class="head"><div class="phaseicon">END</div><div><div class="kicker">Final Product Outcome</div><div class="title">'+o.title+'</div><div class="small" style="color:#e0f2fe">The outcome reflects the full lifecycle trail.</div></div><div class="pill">Health '+health()+'%</div></div><div class="eventbig"><div class="endcard '+o.tone+'"><h2>'+o.title+'</h2><p>'+o.text+'</p><p><b>Final stats:</b> Health '+health()+' | Access '+state.stats.access+' | Timeline '+state.stats.timeline+' | Profitability '+state.stats.profit+' | Open Debt '+state.debt.length+' | Resolved Debt '+state.resolvedDebt.length+' | Rework '+state.reworks+'</p><p><b>Poster takeaway:</b> Regulatory debt is not permanent failure. It is open risk that can be resolved through rework, evidence, and better strategy.</p><button class="btn" onclick="resetGame()">Play Again</button></div></div></section>'+side()+'</div>'}
function render(){document.getElementById('root').innerHTML=!state.started?startScreen():(state.briefing?shell(briefingScreen()):shell(state.done?doneScreen():state.event?eventScreen():game()))}render();
</script>
